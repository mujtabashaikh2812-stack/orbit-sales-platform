<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161922" />
      <stop offset="50%" stop-color="#0E1017" />
      <stop offset="100%" stop-color="#07080C" />
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E0B268" stop-opacity="0.85" />
      <stop offset="50%" stop-color="#3A3F50" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#B98F4D" stop-opacity="0.6" />
    </linearGradient>

    <!-- Primary Gold Ring Gradient -->
    <linearGradient id="ringGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF2D1" />
      <stop offset="35%" stop-color="#E0B268" />
      <stop offset="75%" stop-color="#B98F4D" />
      <stop offset="100%" stop-color="#6B4B1B" />
    </linearGradient>

    <!-- Secondary Ring Gradient -->
    <linearGradient id="ringGrad2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E0B268" stop-opacity="0.95" />
      <stop offset="50%" stop-color="#B98F4D" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#FFF2D1" stop-opacity="0.85" />
    </linearGradient>

    <!-- Core Sphere Radial Gradient -->
    <radialGradient id="coreSphere" cx="35%" cy="32%" r="68%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="20%" stop-color="#FFF0CC" />
      <stop offset="45%" stop-color="#E0B268" />
      <stop offset="80%" stop-color="#B98F4D" />
      <stop offset="100%" stop-color="#6E4A16" />
    </radialGradient>

    <!-- Core Ambient Halo -->
    <radialGradient id="ambientGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#E0B268" stop-opacity="0.5" />
      <stop offset="50%" stop-color="#B98F4D" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#0E1017" stop-opacity="0" />
    </radialGradient>

    <!-- Subtle Glow Filter -->
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Luxury Dark Squircle Base for High Contrast on All Browser Chrome Themes -->
  <rect x="2" y="2" width="60" height="60" rx="15" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="1.3" />

  <!-- Ambient Radiant Halo -->
  <circle cx="32" cy="32" r="21" fill="url(#ambientGlow)" />

  <!-- Outer Orbit Ellipse (Tilted -28 deg) -->
  <g transform="rotate(-28 32 32)">
    <ellipse cx="32" cy="32" rx="22.5" ry="8" stroke="url(#ringGrad1)" stroke-width="1.8" fill="none" opacity="0.95" filter="url(#goldGlow)" />
    
    <!-- Primary Orbiting Telemetry Node -->
    <circle cx="52.5" cy="30" r="2.2" fill="#FFFFFF" filter="url(#goldGlow)" />
    <circle cx="52.5" cy="30" r="3.6" fill="#E0B268" opacity="0.5" />
  </g>

  <!-- Secondary Crossed Orbit Ellipse (Tilted +36 deg) -->
  <g transform="rotate(36 32 32)">
    <ellipse cx="32" cy="32" rx="19" ry="6.5" stroke="url(#ringGrad2)" stroke-width="1.2" stroke-dasharray="3.5 1.8" fill="none" opacity="0.8" />
    
    <!-- Secondary Minor Node -->
    <circle cx="14" cy="33.5" r="1.5" fill="#FFF0CC" />
  </g>

  <!-- Central Celestial Core Planet -->
  <circle cx="32" cy="32" r="8" fill="url(#coreSphere)" filter="url(#goldGlow)" />

  <!-- Specular Reflection Glint -->
  <circle cx="29.5" cy="29.5" r="1.8" fill="#FFFFFF" opacity="0.85" />
</svg>
